{% extends 'base.html' %} 
{% load static %}
{% load crispy_forms_tags %}


{% block content %}
<div class="details">
    <div class="container-fluid">
        <div class="row g-0 details-info rounded">

            <div class="col-12 col-lg-8 details-text">
                <div>
                    <div class="details-heading text-fire rounded">
                        <h1>{{ world.display_name }}</h1>
                    </div>  
                    <div class="details-description mt-5">
                        {{ world.description | safe }}
                    </div>    
                </div>

                <div class="row mx-0">
                    <div class="col-12 col-lg-12 text-end mr-5 mb-5 p-0">
                        <h3 class="mr-5 mr-md-0">{{ world.price }} €</h3>
                    </div>
                    <div class="col-12 col-lg-12 text-center p-0">
                        <a href="{% url 'booking_new' world.pk  %}" class="btn btn-book text-upper w-100 rounded">Book Now!</a>
                    </div>                    
                </div>
            </div>
            <div id="details-img-no-summernote" class="col-12 col-lg-4 order-lg-first details-img-parent d-flex flex-column justify-content-center {% if world.image_dining_url %}d-none{% endif %}" aria-current="image">
                <div class="col-12 col-md-9 col-lg-12 img-fluid mx-auto d-block w-100 h-auto"><a href="{{ world.image_dining.url }}" target="_blank"><img class="details-scale1" src="{{ world.image_dining.url }}" alt="image of the dining area"></a></div>
                <div class="col-12 col-md-9 col-lg-12 img-fluid mx-auto d-block w-100"><a href="{{ world.image_jakuzzi.url }}" target="_blank"><img class="details-scale" src="{{ world.image_jakuzzi.url }}" alt="image of the jakuzzi"></a></div>
                <div class="col-12 col-md-9 col-lg-12 img-fluid mx-auto d-block w-100"><a href="{{ world.image_siesta.url }}" target="_blank"><img class="details-scale" src="{{ world.image_siesta.url }}" alt="image of the siesta area"></a></div>
            </div> 
        </div>
    </div>
</div>
{% endblock %}

{% block extras %}
<script>
    window.addEventListener('load', function() {
        const detailsDescriptionPara = $('.details-description').children('p');
        let imageEl = detailsDescriptionPara.children('img');
        const imageFile = document.getElementById('details-img-no-summernote');
        const detailsText = document.getElementsByClassName('details-text')[0];
        
        // jQuery to locate p that contain span 
        // (summernote default structure)
        $('p:has(span)').css('margin-top', '0');
        
        if (imageEl.length > 0) {
            imageFile.classList.add('d-none');
            detailsText.classList.remove('col-lg-8');
            for (var i = 0; i <= imageEl.length; ++i) {
                var imageElement = imageEl[i];
                // Override summernote img default inline styling 
                imageElement.style.width = '100%';
                imageElement.classList.add('scale2');
                imageElement.style.border = '2px solid #21201e';
            };

        }
    })
</script>
{% endblock extras %}
