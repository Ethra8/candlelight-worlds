{% extends 'base.html' %}

{% load static %}
{% load crispy_forms_tags %}

{% block content %}

<div id="booking-confirm-delete" class="form position-relative">

    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close" onclick="window.history.back();"></button>

    <form method="post">
        {% csrf_token %}
        <p>Are you sure you want to delete your booking:<br>
            "<strong>{{ object.world.display_name }}:</strong> {{ object.date }} at {{ object.time }}"?</p>
            {{ form }}
        <input type="submit" value="Cancel Booking">
    </form>
    
</div>


{% endblock %}
