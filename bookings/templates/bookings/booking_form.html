{% extends 'base.html' %} 

{% load static %}
{% load crispy_forms_tags %}

{% block content %}

  <div class="form">
    
    <h1 class="mb-5">BOOKING FORM</h1>
  
    <form method="post">
      {{ form | crispy }}
      {% csrf_token %}
      <button type="submit" class="btn btn-book w-100 submit-btn rounded"
      id="book-button">BOOK NOW</button>
    </form>
    
  </div>  


{% endblock %}


{% block extras %}
<script>
    $(document).ready(function() {
      $("#id_booking_date").datepicker({
        dateFormat: "dd-mm-yyyy"  // Match the format in your Django model
      });
    });
  </script>
{% endblock %}
