{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-5 contact-form position-relative">
    <button type="button" class="btn-close btn-close-white" aria-label="Close" onclick="window.history.back();"></button>
    <div class="row justify-content-center">
        <div class="col-12 col-md-9 my-5">
            <h2>Contact Form</h2>
            <p>Need any extra information ?<br> Please contact us, and we'll get back ASAP!</p>

            <form method="post">
                {% csrf_token %}
                {{ contact_form | crispy }}

                <button class="btn" type="submit">Submit</button>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
